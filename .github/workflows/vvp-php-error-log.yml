name: VVP PHP error log setup

on:
  push:
    paths:
      - ".github/workflows/vvp-php-error-log.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure and verify PHP error log on VVP
        env:
          BEGET_HOST: ${{ secrets.BEGET_SFTP_HOST }}
          VVP_BEGET_HOST: ${{ secrets.VVP_BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_SFTP_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_SFTP_PASSWORD }}
          BEGET_PATH: ${{ secrets.BEGET_SFTP_PATH }}
        run: |
          python -m pip install --quiet paramiko
          python - <<'PY'
          import os, re, sys, time, posixpath, subprocess, uuid
          from datetime import datetime, timezone
          import paramiko

          host = os.getenv("VVP_BEGET_HOST") or os.getenv("BEGET_HOST")
          user = os.getenv("BEGET_USER")
          password = os.getenv("BEGET_PASSWORD")
          hinted = (os.getenv("BEGET_PATH") or "").rstrip("/")

          missing = [k for k,v in {"host":host,"user":user,"password":password}.items() if not v]
          if missing:
              raise SystemExit("Missing required Beget SFTP secret(s): " + ", ".join(missing))

          transport = paramiko.Transport((host, 22))
          transport.connect(username=user, password=password)
          sftp = paramiko.SFTPClient.from_transport(transport)

          def read_text(path):
              with sftp.open(path, "rb") as f:
                  return f.read().decode("utf-8", "replace")

          def write_text(path, text):
              with sftp.open(path, "wb") as f:
                  f.write(text.encode("utf-8"))
                  f.flush()

          def exists(path):
              try:
                  sftp.stat(path)
                  return True
              except OSError:
                  return False

          def mkdir_p(path):
              parts=[]
              p=path
              while p and p not in ("/","."):
                  parts.append(p)
                  p=posixpath.dirname(p)
              for d in reversed(parts):
                  if not exists(d):
                      sftp.mkdir(d)

          candidates = []
          if hinted:
              candidates += [
                  hinted,
                  posixpath.join(hinted, "test.vidima.rf/public_html"),
                  posixpath.join(posixpath.dirname(hinted), "test.vidima.rf/public_html"),
              ]
          candidates += [
              "/home/d/domainc8/test.vidima.rf/public_html",
              "/test.vidima.rf/public_html",
              "test.vidima.rf/public_html",
          ]
          seen=set()
          candidates=[x for x in candidates if x and not (x in seen or seen.add(x))]

          target=None
          db_pat=re.compile(r"""define\s*\(\s*['"]DB_NAME['"]\s*,\s*['"]domainc8_vvp5475['"]""")
          for c in candidates:
              cfg=posixpath.join(c,"wp-config.php")
              try:
                  txt=read_text(cfg)
              except Exception:
                  continue
              if db_pat.search(txt):
                  target=c.rstrip("/")
                  break

          if not target:
              raise SystemExit("Safety check failed: VVP webroot with DB_NAME domainc8_vvp5475 was not found. No files changed.")

          ht=posixpath.join(target,".htaccess")
          if not exists(ht):
              raise SystemExit("Safety check failed: .htaccess not found in verified VVP webroot.")

          original=read_text(ht)
          parent=posixpath.dirname(target)
          backup_dir=posixpath.join(parent,".vvp-backups","htaccess")
          mkdir_p(backup_dir)
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup=posixpath.join(backup_dir,f".htaccess.before-php-error-log-{stamp}.bak")
          write_text(backup, original)

          marker_begin="# BEGIN VVP PHP ERROR LOG"
          marker_end="# END VVP PHP ERROR LOG"
          block=f"""# BEGIN VVP PHP ERROR LOG
          php_flag display_startup_errors off
          php_flag display_errors off
          php_flag html_errors off
          php_flag log_errors on
          php_value error_reporting 32767
          php_value error_log /home/d/domainc8/test.vidima.rf/PHP_errors.log
          # END VVP PHP ERROR LOG
          """.replace("          ","")

          if marker_begin in original:
              pattern=re.compile(re.escape(marker_begin)+r".*?"+re.escape(marker_end)+r"\n?", re.S)
              modified=pattern.sub(block, original, count=1)
          else:
              modified=block+"\n"+original

          probe_path=None
          changed = modified != original

          def curl(url):
              cmd=[
                  "curl","-sS","-L","--connect-timeout","5","--max-time","20",
                  "--resolve","vvp-media.ru:443:45.130.41.147",
                  "-H","Cache-Control: no-cache",
                  "-w","\n__STATUS__:%{http_code}",
                  url,
              ]
              p=subprocess.run(cmd,text=True,capture_output=True)
              if p.returncode != 0:
                  return 0, "", p.stderr.strip()
              body, _, tail=p.stdout.rpartition("\n__STATUS__:")
              try: status=int(tail.strip())
              except: status=0
              return status, body, ""

          def rollback(reason):
              try:
                  write_text(ht, original)
              except Exception as e:
                  print("ROLLBACK WRITE FAILED:", type(e).__name__)
              if probe_path:
                  try:
                      if exists(probe_path): sftp.remove(probe_path)
                  except Exception:
                      pass
              st,_,_=curl("https://vvp-media.ru/?vvp_rollback_check="+uuid.uuid4().hex)
              print("ROLLED_BACK=1")
              print("ROLLBACK_HTTP="+str(st))
              raise SystemExit(reason)

          try:
              if changed:
                  write_text(ht, modified)

              checks=[
                  ("RU","https://vvp-media.ru/?vvp_php_log_check="+uuid.uuid4().hex),
                  ("ZH","https://vvp-media.ru/zh-hans/?vvp_php_log_check="+uuid.uuid4().hex),
                  ("REST","https://vvp-media.ru/wp-json/?vvp_php_log_check="+uuid.uuid4().hex),
              ]
              for label,url in checks:
                  st,body,err=curl(url)
                  print(f"CHECK_{label}_HTTP={st}")
                  if st != 200:
                      rollback(f"{label} check failed with HTTP {st}; .htaccess restored.")

              probe=uuid.uuid4().hex
              mu_dir=posixpath.join(target,"wp-content","mu-plugins")
              if not exists(mu_dir):
                  mkdir_p(mu_dir)
              probe_path=posixpath.join(mu_dir,"vvp-php-error-log-probe.php")
              php="""<?php
          add_action('init', function () {
              if (isset($_GET['vvp_php_log_probe']) && hash_equals('PROBE', (string) $_GET['vvp_php_log_probe'])) {
                  trigger_error('VVP_PHP_LOG_TEST_PROBE', E_USER_WARNING);
              }
          });
          """.replace("PROBE",probe)
              write_text(probe_path,php)

              log_sftp=posixpath.join(parent,"PHP_errors.log")
              old_size=sftp.stat(log_sftp).st_size if exists(log_sftp) else 0
              st,body,err=curl("https://vvp-media.ru/?vvp_php_log_probe="+probe)
              print("PROBE_HTTP="+str(st))
              if st != 200:
                  rollback(f"PHP probe request failed with HTTP {st}; .htaccess restored.")
              if ("VVP_PHP_LOG_TEST_"+probe) in body:
                  rollback("PHP warning was exposed in HTTP response; .htaccess restored.")

              found=False
              for _ in range(8):
                  time.sleep(1)
                  if exists(log_sftp):
                      with sftp.open(log_sftp,"rb") as f:
                          size=sftp.stat(log_sftp).st_size
                          start=max(0,size-16384)
                          f.seek(start)
                          tail=f.read().decode("utf-8","replace")
                      if ("VVP_PHP_LOG_TEST_"+probe) in tail:
                          found=True
                          break
              if not found:
                  rollback("PHP_errors.log did not receive the probe warning; .htaccess restored.")

              sftp.remove(probe_path)
              probe_path=None
              print("TARGET_VERIFIED=1")
              print("HTACCESS_CHANGED="+("1" if changed else "0"))
              print("BACKUP_CREATED=1")
              print("PHP_LOG_VERIFIED=1")
              print("DISPLAY_ERRORS_VERIFIED_OFF=1")
              print("RESULT=SUCCESS")
          finally:
              try:
                  if probe_path and exists(probe_path):
                      sftp.remove(probe_path)
              except Exception:
                  pass
              sftp.close()
              transport.close()
          PY
