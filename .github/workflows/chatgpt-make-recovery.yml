name: ChatGPT Make recovery

on:
  push:
    branches: [chatgpt-make-recovery]
    paths:
      - .chatgpt/make-recovery-request.txt
      - .github/workflows/chatgpt-make-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-make-recovery
      - name: Inspect Make scenario via stored secret
        env:
          C1: ${{ secrets.MAKE_API_TOKEN }}
          C2: ${{ secrets.MAKE_TOKEN }}
          C3: ${{ secrets.MAKE_API_KEY }}
          C4: ${{ secrets.MAKE_ACCESS_TOKEN }}
          C5: ${{ secrets.VVP_MAKE_API_TOKEN }}
          C6: ${{ secrets.VVP_MAKE_TOKEN }}
          C7: ${{ secrets.MAKE_OPERATIONS_TOKEN }}
          C8: ${{ secrets.VVP_MAKE_OPERATIONS_TOKEN }}
          C9: ${{ secrets.MAKE_MCP_TOKEN }}
          C10: ${{ secrets.VVP_MAKE_MCP_TOKEN }}
          C11: ${{ secrets.MAKE_API }}
          C12: ${{ secrets.MAKE_KEY }}
        run: |
          set -euo pipefail
          TOKEN=""
          SLOT=""
          for n in C1 C2 C3 C4 C5 C6 C7 C8 C9 C10 C11 C12; do
            v="${!n:-}"
            if [ -n "$v" ]; then TOKEN="$v"; SLOT="$n"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "MAKE_TOKEN_FOUND=no"
            exit 2
          fi
          echo "MAKE_TOKEN_FOUND=yes"
          echo "MAKE_TOKEN_SLOT=$SLOT"
          code=$(curl -sS -o /tmp/scenario.json -w '%{http_code}'             -H "Authorization: Token $TOKEN" -H 'Accept: application/json'             'https://us2.make.com/api/v2/scenarios/5943662')
          echo "SCENARIO_HTTP=$code"
          python3 - <<'PY'
          import json
          try:
              x=json.load(open('/tmp/scenario.json'))
          except Exception:
              print('JSON=no'); raise SystemExit
          s=x.get('scenario',x)
          for k in ('id','name','isActive','islinked','scheduling','lastEdit','updatedAt'):
              if k in s: print(f'{k}={s[k]}')
          if 'message' in x and 'scenario' not in x: print('message='+str(x['message']))
          PY
          test "$code" = "200"
